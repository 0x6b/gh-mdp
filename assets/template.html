<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{file_path}} - GFM Preview</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 208 128'><rect width='198' height='118' x='5' y='5' ry='10' stroke='%23000' stroke-width='10' fill='none'/><path d='M30 98V30h20l20 25 20-25h20v68H90V59L70 84 50 59v39zm125 0l-30-33h20V30h20v35h20z'/></svg>">
  <link rel="stylesheet" href="/assets/github-markdown.min.css">
  <link rel="stylesheet" href="/assets/highlight-github.min.css" media="(prefers-color-scheme: light)">
  <link rel="stylesheet" href="/assets/highlight-github-dark.min.css" media="(prefers-color-scheme: dark)">
  <style>
    :root {
      --bg: #f6f8fa; --card: #fff; --border: #d0d7de; --accent: #0969da; --text: #1f2328; --text-muted: #656d76;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #161b22; --card: #0d1117; --border: #30363d; --accent: #58a6ff; --text: #e6edf3; --text-muted: #848d97; }
      .hljs { background: #161b22 !important; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .header { position: sticky; top: 0; z-index: 100; background: var(--card); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; align-items: center; gap: 12px; }
    .header-icon { width: 20px; height: 20px; color: #000; }
    @media (prefers-color-scheme: dark) { .header-icon { color: #fff; } }
    .header-title { font-size: 14px; font-weight: 600; color: #000; }
    @media (prefers-color-scheme: dark) { .header-title { color: #fff; } }
    .copy-btn, .mode-btn { background: none; border: none; border-radius: 6px; padding: 4px; cursor: pointer; display: flex; align-items: center; color: #8b949e; }
    .copy-btn:hover, .mode-btn:hover { background: var(--bg); color: inherit; }
    .copy-btn svg, .mode-btn svg { width: 16px; height: 16px; }
    .mode-btn.active { color: var(--accent); background: var(--bg); }
    .save-status { font-size: 12px; color: var(--text-muted); margin-left: auto; }
    .save-status.saving { color: var(--accent); }
    .save-status.saved { color: #2da44e; }
    .save-status.error { color: #cf222e; }
    .layout { display: flex; width: 100%; max-width: 1400px; margin: 0 auto; padding: 32px 24px; gap: 32px; }
    .main-content { flex: 1; min-width: 0; }
    .markdown-body { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 32px 40px; min-height: calc(100vh - 150px); }
    .markdown-body pre code { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
    .markdown-body .anchor { scroll-margin-top: 70px; }
    .editor-container { display: none; height: calc(100vh - 140px); }
    .editor-container.active { display: block; }
    /* OverType container styling */
    .editor-container > div {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      height: 100% !important;
      min-height: 100% !important;
    }
    .editor-container textarea {
      height: 100% !important;
      min-height: 100% !important;
    }
    .toc-sidebar { width: 250px; flex-shrink: 0; }
    .toc { position: sticky; top: 80px; max-height: calc(100vh - 100px); overflow-y: auto; }
    .toc-title { color: var(--text-muted); margin-bottom: 12px; }
    .toc-title svg { width: 16px; height: 16px; }
    .toc-list { list-style: none; margin: 0; padding: 0; }
    .toc-list li { margin: 0; }
    .toc-list a { display: block; padding: 4px 0; font-size: 13px; color: var(--text-muted); text-decoration: none; border-left: 2px solid transparent; transition: color 0.15s, border-color 0.15s; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .toc-list a:hover { color: var(--text); }
    .toc-list a.active { color: var(--accent); border-left-color: var(--accent); }
    .toc-list a[data-level="1"] { padding-left: 8px; font-weight: 700; }
    .toc-list a[data-level="2"] { padding-left: 8px; }
    .toc-list a[data-level="3"] { padding-left: 20px; }
    .toc-list a[data-level="4"] { padding-left: 32px; }
    .toc-list a[data-level="5"] { padding-left: 44px; }
    .toc-list a[data-level="6"] { padding-left: 56px; }
    @media (max-width: 1100px) {
      .toc-sidebar { display: none; }
      .layout { padding: 32px 16px; }
    }

    /* Mermaid diagram container */
    .mermaid-container {
      position: relative;
      margin: 16px 0;
    }
    .mermaid-container .mermaid {
      overflow-x: auto;
    }
    .mermaid-fullsize-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s, color 0.15s, background 0.15s;
      z-index: 10;
    }
    .mermaid-container:hover .mermaid-fullsize-btn {
      opacity: 1;
    }
    .mermaid-fullsize-btn:hover {
      color: var(--text);
      background: var(--bg);
    }
    .mermaid-fullsize-btn svg {
      width: 14px;
      height: 14px;
    }

    /* Fullscreen modal */
    .mermaid-modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.5);
    }
    .mermaid-modal.active {
      display: flex;
    }
    .mermaid-modal-content {
      position: relative;
      min-width: 90vw;
      max-width: 95vw;
      max-height: 95vh;
      overflow: auto;
      background: var(--card);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }
    .mermaid-modal-content .mermaid {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mermaid-modal-content .mermaid svg {
      max-width: none;
      max-height: none;
    }
    .mermaid-modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      padding: 0;
      color: var(--text-muted);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      transition: color 0.15s, background 0.15s;
    }
    .mermaid-modal-close:hover {
      color: var(--text);
      background: var(--border);
    }
    .mermaid-modal-close svg {
      width: 16px;
      height: 16px;
    }
  </style>
  <script>
    // Connect WebSocket immediately in head - no dependencies
    var wsQueue = [];
    var wsReady = false;
    function connect() {
      const ws = new WebSocket(`ws://${location.host}/ws`);
      ws.onclose = () => setTimeout(connect, 2000);
      ws.onmessage = e => {
        if (wsReady) handleWsMessage(e.data);
        else wsQueue.push(e.data);
      };
    }
    connect();
  </script>
</head>
<body>
  <header class="header">
    <svg class="header-icon" viewBox="0 0 208 128"><rect width="198" height="118" x="5" y="5" ry="10" stroke="currentColor" stroke-width="10" fill="none"/><path fill="currentColor" d="M30 98V30h20l20 25 20-25h20v68H90V59L70 84 50 59v39zm125 0l-30-33h20V30h20v35h20z"/></svg>
    <span class="header-title" id="file-path">{{file_path}}</span>
    <button class="copy-btn" id="copy-btn" title="Copy path">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 0 1 0 1.5h-1.5a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5A1.75 1.75 0 0 1 9.25 16h-7.5A1.75 1.75 0 0 1 0 14.25Z"/><path d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0 1 14.25 11h-7.5A1.75 1.75 0 0 1 5 9.25Zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25Z"/></svg>
    </button>
    <button class="mode-btn" id="mode-btn" title="Edit">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M11.013 1.427a1.75 1.75 0 0 1 2.474 0l1.086 1.086a1.75 1.75 0 0 1 0 2.474l-8.61 8.61c-.21.21-.47.364-.756.445l-3.251.93a.75.75 0 0 1-.927-.928l.929-3.25c.081-.286.235-.547.445-.758l8.61-8.61Zm.176 4.823L9.75 4.81l-6.286 6.287a.253.253 0 0 0-.064.108l-.558 1.953 1.953-.558a.253.253 0 0 0 .108-.064Zm1.238-3.763a.25.25 0 0 0-.354 0L10.811 3.75l1.439 1.44 1.263-1.263a.25.25 0 0 0 0-.354Z"/></svg>
    </button>
    <span class="save-status" id="save-status"></span>
  </header>
  <div class="layout">
    <main class="main-content">
      <article class="markdown-body" id="content">{{content}}</article>
      <div class="editor-container" id="editor"></div>
    </main>
    <aside class="toc-sidebar">
      <nav class="toc">
        <div class="toc-title"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 4a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm3.75-1.5a.75.75 0 0 0 0 1.5h8.5a.75.75 0 0 0 0-1.5h-8.5zm0 5a.75.75 0 0 0 0 1.5h8.5a.75.75 0 0 0 0-1.5h-8.5zm0 5a.75.75 0 0 0 0 1.5h8.5a.75.75 0 0 0 0-1.5h-8.5zM3 8a1 1 0 1 1-2 0 1 1 0 0 1 2 0zm-1 6a1 1 0 1 0 0-2 1 1 0 0 0 0 2z"/></svg></div>
        <ul class="toc-list" id="toc-list"></ul>
      </nav>
    </aside>
  </div>
  <!-- Mermaid fullscreen modal -->
  <div class="mermaid-modal" id="mermaid-modal">
    <div class="mermaid-modal-content">
      <button class="mermaid-modal-close" id="mermaid-modal-close" title="Close">
        <svg viewBox="0 0 16 16" fill="currentColor"><path d="M3.72 3.72a.75.75 0 0 1 1.06 0L8 6.94l3.22-3.22a.749.749 0 0 1 1.275.326.749.749 0 0 1-.215.734L9.06 8l3.22 3.22a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215L8 9.06l-3.22 3.22a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042L6.94 8 3.72 4.78a.75.75 0 0 1 0-1.06Z"/></svg>
      </button>
      <div class="mermaid" id="mermaid-modal-diagram"></div>
    </div>
  </div>
  <script src="/assets/morphdom.min.js"></script>
  <script>
    const $ = s => document.querySelector(s), $$ = s => document.querySelectorAll(s);
    const filePath = $('#file-path').textContent;
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

    // Edit mode state
    let currentMode = 'preview';
    let editorInitialized = false;
    let editor = null;
    let lastLocalEdit = 0;
    let saveTimeout = null;
    let isSaving = false;

    const findAnchor = () => {
      let best = null, bestOff = Infinity;
      for (const el of $$('#content h1,#content h2,#content h3,#content h4,#content p,#content li,#content pre')) {
        const off = el.getBoundingClientRect().top;
        if (off >= -50 && off < bestOff) { best = el; bestOff = off; }
      }
      return best ? { tag: best.tagName, text: best.textContent.slice(0,100), off: bestOff } : null;
    };
    const restoreAnchor = a => {
      if (!a) return false;
      for (const el of $$(a.tag)) if (el.textContent.slice(0,100) === a.text) {
        window.scrollTo(0, el.getBoundingClientRect().top + window.scrollY - a.off);
        return true;
      }
      return false;
    };

    // Handle WebSocket messages (called from head script)
    var handleWsMessage = msg => {
      const data = JSON.parse(msg);
      if (data.type !== 'update') return;
      if (data.path !== filePath) return;

      // In edit mode, skip updates within 2s of local edit (infinite loop prevention)
      if (currentMode === 'edit' && Date.now() - lastLocalEdit < 2000) return;

      // Update preview
      const content = $('#content');
      const anchor = findAnchor(), scrollY = window.scrollY;
      const tmp = document.createElement('div');
      tmp.innerHTML = data.content;
      morphdom(content, tmp, {
        childrenOnly: true,
        onBeforeElUpdated: (from, to) => from.tagName === 'CODE' && from.classList.contains('hljs') && from.textContent === to.textContent ? false : true
      });
      if (typeof hljs !== 'undefined') $$('pre code:not(.hljs):not(.language-mermaid)').forEach(b => hljs.highlightElement(b));
      if (typeof renderMermaid === 'function') renderMermaid();
      if (typeof buildToc === 'function') buildToc();
      if (typeof bindTaskCheckboxes === 'function') bindTaskCheckboxes();
      if (currentMode === 'preview') {
        requestAnimationFrame(() => { if (!restoreAnchor(anchor)) window.scrollTo(0, scrollY); });
      }

      // Update editor content if initialized and in edit mode
      if (editorInitialized && editor && currentMode === 'edit') {
        // Fetch fresh markdown and update editor if content differs
        fetch('/raw').then(r => r.text()).then(markdown => {
          if (editor[0].getValue() !== markdown) {
            editor[0].setValue(markdown);
          }
        });
      }
    };

    // Process any queued messages and mark ready
    wsReady = true;
    wsQueue.forEach(handleWsMessage);
    wsQueue = [];

    // Mode toggle
    const modeBtn = $('#mode-btn');
    const updateModeButton = (mode) => {
      if (mode === 'edit') {
        modeBtn.title = 'Preview';
        modeBtn.innerHTML = '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 2c1.981 0 3.671.992 4.933 2.078 1.27 1.091 2.187 2.345 2.637 3.023a1.62 1.62 0 0 1 0 1.798c-.45.678-1.367 1.932-2.637 3.023C11.67 13.008 9.981 14 8 14c-1.981 0-3.671-.992-4.933-2.078C1.797 10.83.88 9.576.43 8.898a1.62 1.62 0 0 1 0-1.798c.45-.677 1.367-1.931 2.637-3.022C4.33 2.992 6.019 2 8 2ZM1.679 7.932a.12.12 0 0 0 0 .136c.411.622 1.241 1.75 2.366 2.717C5.176 11.758 6.527 12.5 8 12.5c1.473 0 2.825-.742 3.955-1.715 1.124-.967 1.954-2.096 2.366-2.717a.12.12 0 0 0 0-.136c-.412-.621-1.242-1.75-2.366-2.717C10.824 4.242 9.473 3.5 8 3.5c-1.473 0-2.824.742-3.955 1.715-1.124.967-1.954 2.096-2.366 2.717ZM8 10a2 2 0 1 1-.001-3.999A2 2 0 0 1 8 10Z"/></svg>';
        modeBtn.classList.add('active');
      } else {
        modeBtn.title = 'Edit';
        modeBtn.innerHTML = '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M11.013 1.427a1.75 1.75 0 0 1 2.474 0l1.086 1.086a1.75 1.75 0 0 1 0 2.474l-8.61 8.61c-.21.21-.47.364-.756.445l-3.251.93a.75.75 0 0 1-.927-.928l.929-3.25c.081-.286.235-.547.445-.758l8.61-8.61Zm.176 4.823L9.75 4.81l-6.286 6.287a.253.253 0 0 0-.064.108l-.558 1.953 1.953-.558a.253.253 0 0 0 .108-.064Zm1.238-3.763a.25.25 0 0 0-.354 0L10.811 3.75l1.439 1.44 1.263-1.263a.25.25 0 0 0 0-.354Z"/></svg>';
        modeBtn.classList.remove('active');
      }
    };

    const updateStatus = (cls, text) => {
      const el = $('#save-status');
      el.className = 'save-status ' + cls;
      el.textContent = text;
    };

    const saveContent = async (content) => {
      if (isSaving) return;
      isSaving = true;
      updateStatus('saving', 'Saving...');
      try {
        const res = await fetch('/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content })
        });
        const data = await res.json();
        if (data.success) {
          updateStatus('saved', 'Saved');
          setTimeout(() => updateStatus('', ''), 2000);
        } else {
          updateStatus('error', 'Error: ' + data.error);
        }
      } catch (e) {
        updateStatus('error', 'Error: ' + e.message);
      } finally {
        isSaving = false;
      }
    };

    const debounce = (fn, ms) => {
      let timeout;
      return (...args) => {
        clearTimeout(timeout);
        timeout = setTimeout(() => fn(...args), ms);
      };
    };

    const debouncedSave = debounce(saveContent, 1000);

    const switchToEdit = async () => {
      // Show editor container first (needed for OverType to calculate dimensions)
      $('#content').style.display = 'none';
      $('#editor').classList.add('active');

      if (!editorInitialized) {
        // Load OverType script dynamically
        const script = document.createElement('script');
        script.src = '/assets/overtype.min.js';
        script.onload = async () => {
          const res = await fetch('/raw');
          const markdown = await res.text();
          editor = new OverType('#editor', {
            value: markdown,
            theme: prefersDark ? 'cave' : 'solar',
            toolbar: true,
            autoResize: false,
            onChange: (value) => {
              lastLocalEdit = Date.now();
              debouncedSave(value);
            },
            showStats: true
          });
          editorInitialized = true;
          finishSwitchToEdit();
        };
        document.head.appendChild(script);
      } else {
        // Refresh content before switching
        const res = await fetch('/raw');
        const markdown = await res.text();
        if (editor[0].getValue() !== markdown) {
          editor[0].setValue(markdown);
        }
        finishSwitchToEdit();
      }
    };

    const finishSwitchToEdit = () => {
      updateModeButton('edit');
      currentMode = 'edit';
      // Focus the editor textarea
      if (editor && editor[0]) {
        editor[0].focus();
      }
    };

    const switchToPreview = async () => {
      // Fetch fresh rendered content before showing preview
      const res = await fetch('/');
      const html = await res.text();
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');
      const newContent = doc.getElementById('content');
      if (newContent) {
        morphdom($('#content'), newContent, { childrenOnly: true });
        if (typeof hljs !== 'undefined') $$('pre code:not(.hljs):not(.language-mermaid)').forEach(b => hljs.highlightElement(b));
        if (typeof renderMermaid === 'function') renderMermaid();
        if (typeof buildToc === 'function') buildToc();
        if (typeof bindTaskCheckboxes === 'function') bindTaskCheckboxes();
      }
      $('#content').style.display = 'block';
      $('#editor').classList.remove('active');
      updateModeButton('preview');
      currentMode = 'preview';
    };

    modeBtn.onclick = () => {
      if (currentMode === 'preview') {
        switchToEdit();
      } else {
        switchToPreview();
      }
    };

    // Theme switching
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
      if (editorInitialized && editor) {
        editor[0].setTheme(e.matches ? 'cave' : 'solar');
      }
    });

    // Keyboard shortcuts for mode switching
    document.addEventListener('keydown', (e) => {
      if (currentMode === 'edit' && (e.key === 'Escape' || (e.key === 'Enter' && (e.metaKey || e.ctrlKey)))) {
        e.preventDefault();
        switchToPreview();
      }
      if (e.key === 'e' && currentMode === 'preview' && !e.metaKey && !e.ctrlKey && !e.altKey) {
        e.preventDefault();
        switchToEdit();
      }
    });
  </script>
  <script src="/assets/highlight.min.js"></script>
  <script src="/assets/mermaid.min.js"></script>
  <script>
    const highlightCode = () => $$('pre code:not(.hljs):not(.language-mermaid)').forEach(b => hljs.highlightElement(b));
    mermaid.initialize({ startOnLoad: false, theme: window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'default' });
    let mermaidId = 0;
    var renderMermaid = async () => {
      for (const code of $$('pre code.language-mermaid')) {
        const pre = code.parentElement;
        const definition = code.textContent;
        const id = `mermaid-${mermaidId++}`;
        try {
          const { svg } = await mermaid.render(id, definition);
          // Create container with button
          const container = document.createElement('div');
          container.className = 'mermaid-container';
          container.dataset.definition = definition;
          // Create fullsize button
          const btn = document.createElement('button');
          btn.className = 'mermaid-fullsize-btn';
          btn.title = 'Show full size';
          btn.innerHTML = '<svg viewBox="0 0 16 16" fill="currentColor"><path fill-rule="evenodd" d="M3.72 3.72a.75.75 0 011.06 1.06L2.56 7h10.88l-2.22-2.22a.75.75 0 011.06-1.06l3.5 3.5a.75.75 0 010 1.06l-3.5 3.5a.75.75 0 11-1.06-1.06l2.22-2.22H2.56l2.22 2.22a.75.75 0 11-1.06 1.06l-3.5-3.5a.75.75 0 010-1.06l3.5-3.5z"/></svg>';
          btn.onclick = () => openMermaidModal(definition);
          // Create mermaid div
          const div = document.createElement('div');
          div.className = 'mermaid';
          div.innerHTML = svg;
          container.appendChild(btn);
          container.appendChild(div);
          pre.replaceWith(container);
        } catch (e) {
          console.error('Mermaid render error:', e);
        }
      }
    };

    // Mermaid fullscreen modal
    let modalMermaidId = 0;
    const openMermaidModal = async (definition) => {
      const modal = $('#mermaid-modal');
      const diagramContainer = $('#mermaid-modal-diagram');
      const id = `mermaid-modal-${modalMermaidId++}`;
      try {
        const { svg } = await mermaid.render(id, definition);
        diagramContainer.innerHTML = svg;
        modal.classList.add('active');
        document.body.style.overflow = 'hidden';
      } catch (e) {
        console.error('Mermaid modal render error:', e);
      }
    };
    const closeMermaidModal = () => {
      const modal = $('#mermaid-modal');
      modal.classList.remove('active');
      document.body.style.overflow = '';
      $('#mermaid-modal-diagram').innerHTML = '';
    };
    // Modal event listeners
    $('#mermaid-modal-close').onclick = closeMermaidModal;
    $('#mermaid-modal').onclick = (e) => {
      if (e.target === e.currentTarget) closeMermaidModal();
    };
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && $('#mermaid-modal').classList.contains('active')) {
        closeMermaidModal();
      }
    });

    // TOC generation
    var buildToc = () => {
      const tocList = $('#toc-list');
      const headings = $$('#content h1, #content h2, #content h3, #content h4, #content h5, #content h6');
      tocList.innerHTML = '';
      headings.forEach(h => {
        const anchor = h.querySelector('.anchor');
        if (!anchor) return;
        const id = anchor.id;
        const level = parseInt(h.tagName[1]);
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = `#${id}`;
        a.textContent = h.textContent;
        a.dataset.level = level;
        a.dataset.id = id;
        a.onclick = e => {
          e.preventDefault();
          const target = document.getElementById(id);
          if (target) {
            target.scrollIntoView({ behavior: 'smooth' });
            history.pushState(null, '', `#${id}`);
          }
        };
        li.appendChild(a);
        tocList.appendChild(li);
      });
      updateActiveToc();
    };

    // Scroll spy for TOC
    let tocLinks = [];
    let headingPositions = [];
    const updateActiveToc = () => {
      tocLinks = [...$$('.toc-list a')];
      headingPositions = tocLinks.map(a => {
        const el = document.getElementById(a.dataset.id);
        return el ? el.getBoundingClientRect().top + window.scrollY : Infinity;
      });
    };
    const highlightActiveToc = () => {
      const scrollPos = window.scrollY + 100;
      let activeIdx = 0;
      for (let i = headingPositions.length - 1; i >= 0; i--) {
        if (scrollPos >= headingPositions[i]) { activeIdx = i; break; }
      }
      tocLinks.forEach((a, i) => a.classList.toggle('active', i === activeIdx));
    };
    let scrollTicking = false;
    window.addEventListener('scroll', () => {
      if (!scrollTicking) {
        requestAnimationFrame(() => { highlightActiveToc(); scrollTicking = false; });
        scrollTicking = true;
      }
    });
    window.addEventListener('resize', () => requestAnimationFrame(updateActiveToc));

    // Task list checkbox toggling
    var bindTaskCheckboxes = () => {
      $$('#content input[type="checkbox"][data-task-index]').forEach(cb => {
        cb.disabled = false;
        const li = cb.closest('li');
        if (!li) return;
        li.style.cursor = 'pointer';
        const toggle = async (e) => {
          // Don't toggle when clicking links inside the task item
          if (e.target.closest('a')) return;
          e.preventDefault();
          cb.disabled = true;
          li.style.pointerEvents = 'none';
          try {
            const res = await fetch('/toggle-task', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ index: parseInt(cb.dataset.taskIndex) })
            });
            const data = await res.json();
            if (!data.success) console.error('Toggle failed:', data.error);
          } catch (err) {
            console.error('Toggle error:', err);
          } finally {
            cb.disabled = false;
            li.style.pointerEvents = '';
          }
        };
        li.onclick = toggle;
      });
    };

    highlightCode();
    renderMermaid();
    buildToc();
    bindTaskCheckboxes();
    $('#copy-btn').onclick = async () => {
      const btn = $('#copy-btn');
      const original = btn.innerHTML;
      try {
        await navigator.clipboard.writeText($('#file-path').textContent);
        btn.innerHTML = '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M13.78 4.22a.75.75 0 0 1 0 1.06l-7.25 7.25a.75.75 0 0 1-1.06 0L2.22 9.28a.751.751 0 0 1 .018-1.042.751.751 0 0 1 1.042-.018L6 10.94l6.72-6.72a.75.75 0 0 1 1.06 0Z"/></svg>';
        btn.style.color = '#2da44e';
      } catch {
        btn.style.color = '#cf222e';
      }
      setTimeout(() => { btn.innerHTML = original; btn.style.color = ''; }, 2000);
    };
  </script>
</body>
</html>
