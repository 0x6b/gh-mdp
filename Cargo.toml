[package]
name = "gh-mdp"
version = "0.17.0"
edition = "2024"
description = "A GitHub Flavored Markdown live preview server"

[[bin]]
name = "gh-mdp"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "sync", "macros", "fs"] }

# Web server
axum = { version = "0.8.9", features = ["ws"] }
tower-http = { version = "0.7.0", features = ["cors", "trace"] }
futures = "0.3.34"

# Markdown rendering
pulldown-cmark = { version = "0.13.4", features = ["simd"] }

# File watching
notify-debouncer-mini = "0.7.0"
ignore = "0.4.33"

# MIME type detection
mime_guess = "2.0.5"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Error management
anyhow = "1.0.104"

# CLI handling
clap = { version = "4.6.6", features = ["derive"] }

# Ser/deserialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"

# Open URL
open = "5.4.2"

[build-dependencies]
reqwest = { version = "0.13.4", features = ["blocking"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
